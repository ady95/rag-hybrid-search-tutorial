name: ragbook

services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile
    image: ragbook-pg:16-vector-bigm
    container_name: ragbook_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-raguser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ragpass}
      POSTGRES_DB: ${POSTGRES_DB:-ragbook}
      TZ: Asia/Seoul
      LANG: C.UTF-8
    command: >
      postgres
      -c shared_preload_libraries=pg_bigm
      -c shared_buffers=512MB
      -c maintenance_work_mem=512MB
      -c work_mem=32MB
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-raguser} -d ${POSTGRES_DB:-ragbook}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    shm_size: 512m

volumes:
  pgdata:
