<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>하이브리드 검색 비교 데모</title>
<style>
:root{
  --bg:#f1f5f9; --panel:#fff; --line:#e2e8f0; --ink:#0f172a; --dim:#64748b;
  --faint:#94a3b8; --dark:#1e293b; --kw:#2563eb; --se:#7c3aed; --fb:#ca8a04;
  --hy:#059669;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-size:13px;
  font-family:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif}
header{background:var(--dark);color:#fff;padding:9px 16px;display:flex;
  align-items:center;gap:10px}
header h1{font-size:14px;margin:0;font-weight:600}
header .sub{font-size:11px;color:#94a3b8}
header .health{margin-left:auto;font-size:11px;color:#cbd5e1;font-family:ui-monospace,Consolas,monospace}
.bar{background:var(--panel);border-bottom:1px solid var(--line);padding:11px 16px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row+.row{margin-top:8px}
input[type=text]{flex:1;min-width:240px;padding:8px 11px;border:1px solid #cbd5e1;
  border-radius:6px;font-size:13px;font-family:inherit}
input[type=text]:focus{outline:none;border-color:#64748b}
button{font-family:inherit;font-size:12px;cursor:pointer}
.go{padding:8px 18px;background:var(--dark);color:#fff;border:0;border-radius:6px;
  font-weight:600}
.go:disabled{background:#cbd5e1}
.chip{padding:3px 9px;border:1px solid var(--line);border-radius:5px;background:#fff;
  color:var(--dim)}
.chip.on{background:var(--dark);color:#fff;border-color:var(--dark)}
.lbl{color:var(--faint);font-size:11px}
.timings{margin-left:auto;font-family:ui-monospace,Consolas,monospace;color:var(--dim);
  font-size:11px}
.timings b{color:var(--ink)}
.tok{padding:6px 16px;font-size:11px;color:var(--dim);background:#f8fafc;
  border-bottom:1px solid var(--line);font-family:ui-monospace,Consolas,monospace;
  overflow-x:auto;white-space:nowrap}
.tok span{color:var(--ink)}
main{padding:12px 16px 40px}
.cols{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media(max-width:1100px){.cols{grid-template-columns:repeat(2,minmax(0,1fr))}}
.colhead{position:sticky;top:0;background:var(--bg);padding:5px 8px;border-radius:5px;
  font-weight:600;font-size:12px;display:flex;align-items:baseline;gap:6px;z-index:2}
.colhead .ms{font-size:10px;color:var(--faint);font-weight:400;
  font-family:ui-monospace,Consolas,monospace;margin-left:auto}
.k-keyword{color:var(--kw)} .k-semantic{color:var(--se)}
.k-fallback{color:var(--fb)} .k-hybrid{color:var(--hy)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:7px;
  padding:9px 10px;margin-bottom:7px}
.card.new{border-color:#6ee7b7;background:#f0fdf9}
.card .top{display:flex;gap:7px;align-items:baseline}
.card .rk{font-family:ui-monospace,Consolas,monospace;color:var(--faint);font-size:11px}
.card .ti{font-weight:600;font-size:12px;line-height:1.35;word-break:keep-all}
.card .meta{font-size:10px;color:var(--faint);margin-top:3px;
  font-family:ui-monospace,Consolas,monospace}
.card .bd{font-size:11.5px;color:#334155;line-height:1.55;margin-top:5px;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card.open .bd{-webkit-line-clamp:unset;display:block;white-space:pre-wrap}
.hits{margin-top:5px;display:flex;gap:4px;flex-wrap:wrap}
.hit{font-size:10px;padding:1px 6px;border-radius:9px;background:#f1f5f9;
  color:var(--dim);font-family:ui-monospace,Consolas,monospace}
.hit.keyword{background:#eff6ff;color:var(--kw)}
.hit.semantic{background:#f5f3ff;color:var(--se)}
.hit.fallback{background:#fefce8;color:var(--fb)}
.more{border:0;background:none;color:#3b82f6;font-size:10px;padding:3px 0 0}
.note{padding:8px 10px;background:#fff;border:1px solid var(--line);border-radius:7px;
  margin-bottom:10px;font-size:11.5px;color:var(--dim);line-height:1.7}
.note b{color:var(--ink)}
.empty{color:var(--faint);text-align:center;padding:40px 0}
.err{background:#fef2f2;color:#b91c1c;padding:10px;border-radius:6px;margin-bottom:10px}
</style>
</head>
<body>
<header>
  <span>&#128269;</span>
  <h1>하이브리드 검색 비교 데모</h1>
  <span class="sub">FTS5+Kiwi &middot; sqlite-vec / pgvector &middot; trigram / pg_bigm &middot; RRF</span>
  <span class="health" id="health">…</span>
</header>

<div class="bar">
  <form class="row" id="f">
    <input type="text" id="q" placeholder="질의를 입력하세요 (예: AI 반도체 수출 규제)"
           value="AI 반도체 수출 규제" autocomplete="off">
    <button class="go" id="go">검색</button>
  </form>
  <div class="row">
    <span class="lbl">DB</span><span id="backends"></span>
    <span class="lbl" style="margin-left:8px">모드</span><span id="modes"></span>
    <span class="lbl" style="margin-left:8px">top</span>
    <select id="topn"><option>5</option><option selected>10</option><option>20</option></select>
    <span class="timings" id="timings"></span>
  </div>
  <div class="row">
    <span class="lbl">기간</span><span id="yms"></span>
  </div>
</div>
<div class="tok" id="tok"></div>

<main>
  <div id="err"></div>
  <div id="note"></div>
  <div class="cols" id="cols"></div>
</main>

<script>
const MODES = ["keyword","semantic","fallback","hybrid"];
const KO = {keyword:"키워드", semantic:"의미", fallback:"폴백", hybrid:"하이브리드"};
const S = {backend:"sqlite", mode:"compare", ym:null, topn:10};

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

function chips(host, items, get, set) {
  host.innerHTML = "";
  for (const it of items) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "chip" + (get() === it.v ? " on" : "");
    b.textContent = it.label;
    b.onclick = () => { set(it.v); render(); };
    host.appendChild(b);
  }
}

function render() {
  chips($("backends"), [{v:"sqlite",label:"SQLite"},{v:"postgres",label:"PostgreSQL"}],
        () => S.backend, v => S.backend = v);
  chips($("modes"), [{v:"compare",label:"4모드 비교"}].concat(
          MODES.map(m => ({v:m, label:KO[m]}))),
        () => S.mode, v => S.mode = v);
  chips($("yms"), [{v:null,label:"전체"}].concat(
          (S.options?.year_months || []).map(o => ({v:o.value, label:o.value}))),
        () => S.ym, v => S.ym = v);
}

function card(r, lifted) {
  const el = document.createElement("div");
  el.className = "card" + (lifted ? " new" : "");
  const hits = (r.hits || []).map(h => {
    const src = h.split("#")[0];
    return `<span class="hit ${esc(src)}">${esc(h)}</span>`;
  }).join("");
  el.innerHTML =
    `<div class="top"><span class="rk">#${r.rank}</span>` +
    `<span class="ti">${esc(r.title) || "(제목 없음)"}</span></div>` +
    `<div class="meta">${esc(r.year_month)} · ${esc(r.chunk_id)} · score ${r.score.toFixed(4)}</div>` +
    `<div class="bd">${esc(r.body)}</div>` +
    (hits ? `<div class="hits">${hits}</div>` : "") +
    `<button class="more">▼ 본문 전체</button>`;
  el.querySelector(".more").onclick = () => {
    el.classList.toggle("open");
    el.querySelector(".more").textContent =
      el.classList.contains("open") ? "▲ 접기" : "▼ 본문 전체";
  };
  return el;
}

function draw(data) {
  const cols = $("cols"), note = $("note");
  cols.innerHTML = ""; note.innerHTML = "";
  const shown = Object.keys(data.results);

  $("timings").innerHTML = shown
    .map(m => `${KO[m]} <b>${data.timings_ms[m] ?? "—"}</b>ms`).join(" &nbsp; ");
  $("tok").innerHTML = `Kiwi 토큰 <span>${esc((data.tokens || []).join(" "))}</span>` +
    `  →  FTS5 <span>${esc(data.fts_query || "(없음)")}</span>`;

  const a = data.agreement;
  if (a) {
    note.className = "note";
    note.innerHTML =
      `<b>하이브리드 ${a.hybrid.n}건</b> 중 <b>${a.hybrid.lifted}건</b>은 어느 단일 모드의 ` +
      `상위 ${S.topn}위에도 없던 결과입니다(연두색 카드). RRF가 여러 검색기에서 ` +
      `중간 순위로 걸린 청크를 끌어올린 것입니다. ` +
      `하이브리드와 겹친 건수 — 키워드 ${a.keyword.overlap_hybrid}/${a.keyword.n}, ` +
      `의미 ${a.semantic.overlap_hybrid}/${a.semantic.n}, ` +
      `폴백 ${a.fallback.overlap_hybrid}/${a.fallback.n}`;
  }

  const single = new Set();
  for (const m of ["keyword","semantic","fallback"])
    for (const r of data.results[m] || []) single.add(r.chunk_id);

  cols.style.gridTemplateColumns =
    `repeat(${Math.min(shown.length, 4)},minmax(0,1fr))`;
  for (const m of shown) {
    const col = document.createElement("div");
    col.innerHTML = `<div class="colhead k-${m}">${KO[m]}` +
      `<span class="ms">${data.timings_ms[m] ?? "—"} ms</span></div>`;
    const rows = data.results[m] || [];
    if (!rows.length) col.innerHTML += `<div class="empty">결과 없음</div>`;
    for (const r of rows)
      col.appendChild(card(r, m === "hybrid" && !single.has(r.chunk_id)));
    cols.appendChild(col);
  }
}

async function go(e) {
  e?.preventDefault();
  const query = $("q").value.trim();
  if (!query) return;
  $("go").disabled = true; $("err").innerHTML = "";
  try {
    const r = await fetch("/api/search", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({query, mode: S.mode, backend: S.backend,
                            top_n: S.topn, ym: S.ym}),
    });
    const data = await r.json();
    if (data.error) throw new Error(data.error);
    draw(data);
  } catch (err) {
    $("err").className = "err";
    $("err").textContent = String(err);
  } finally {
    $("go").disabled = false;
  }
}

$("f").onsubmit = go;
$("topn").onchange = (e) => S.topn = Number(e.target.value);

fetch("/api/health").then(r => r.json()).then(h => {
  $("health").textContent =
    `SQLite ${h.sqlite ?? "—"} · PG ${h.postgres ?? "—"} · 임베딩 ${h.embed}`;
});
fetch("/api/options").then(r => r.json()).then(o => { S.options = o; render(); });
render();
</script>
</body>
</html>
